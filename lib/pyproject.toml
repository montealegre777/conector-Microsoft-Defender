[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-microsoft-defender-connector"
version = "1.0.0"
description = "Conector Ruvic para Microsoft Defender for Endpoint: listar alertas, consultar una máquina, y aislar/liberar un dispositivo"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3.0",
]

[tool.setuptools.packages.find]
include = ["ruvic_microsoft_defender_connector*"]
